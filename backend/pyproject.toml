[project]
name = "ccms"
version = "0.1.0"
description = "Campus Camera & NVR Health Monitoring System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "celery>=5.4",
    "redis>=5.0",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "cryptography>=42",
    "icmplib>=3.0.4",
    "tenacity>=8.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "aiosmtplib>=3.0",
    "onvif-zeep>=0.2.12",
    "pysnmp>=6.1",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "websockets>=13.0",
    "honcho>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccms"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
