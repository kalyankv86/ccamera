# mediamtx config for CCMS live view (on-demand RTSP -> HLS relay).
# Paths are added/removed dynamically via the API by the backend
# (ccms.live.mediamtx_client) as cameras are registered/updated/deactivated -
# no static camera paths are defined here.
#
# Both the API and HLS server bind to localhost only: the API because it has
# no auth of its own (only the CCMS backend should be able to call it), and
# HLS because it's reverse-proxied through Nginx under /live/ (deploy/nginx/
# ccms.conf.template) rather than exposed on its own port/origin.

logLevel: info

api: yes
apiAddress: 127.0.0.1:9997

rtsp: no
rtmp: no
srt: no
webrtc: no

hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: yes
# fmp4, not mpegts: this fleet is a mix of H.264 and H.265/HEVC cameras
# (confirmed live), and mediamtx's mpegts HLS variant only supports H.264 -
# every HEVC camera's muxer was being destroyed immediately with "the
# MPEG-TS variant of HLS supports H264 video only". fmp4 supports both.
hlsVariant: fmp4
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsAllowOrigin: "*"

paths:
  all_others:
