[project]
name = "ccms-sim"
version = "0.1.0"
description = "CCMS device simulator - fake cameras/NVRs for demoing the monitoring pipeline without hardware"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccms_sim"]
